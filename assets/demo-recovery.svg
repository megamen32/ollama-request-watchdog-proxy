<svg width="1120" height="620" viewBox="0 0 1120 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ollama Watchdog Proxy demo terminal</title>
  <desc id="desc">A terminal-style demo showing Ollama being stopped, a request hitting the watchdog proxy, the proxy restarting Ollama, clamping num_ctx, and returning HTTP 200.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#111827"/><stop offset="55%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22c55e"/><stop offset="50%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/></filter>
    <style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,&quot;Liberation Mono&quot;,monospace}.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.prompt{fill:#7dd3fc}.cmd{fill:#e5e7eb}.ok{fill:#86efac}.warn{fill:#fde68a}.muted{fill:#94a3b8}.accent{fill:#c4b5fd}</style>
  </defs>
  <rect width="1120" height="620" rx="34" fill="url(#bg)"/>
  <circle cx="965" cy="82" r="150" fill="#2563eb" opacity="0.14"/><circle cx="130" cy="540" r="180" fill="#22c55e" opacity="0.10"/>
  <text x="64" y="72" class="sans" fill="#fff" font-size="34" font-weight="800">Ollama Request Watchdog Proxy</text>
  <text x="64" y="106" class="sans" fill="#cbd5e1" font-size="18">Crash Ollama. Send the request anyway. Get a clean recovery path.</text>
  <g filter="url(#shadow)">
    <rect x="64" y="138" width="992" height="418" rx="18" fill="#020617" stroke="#334155"/><rect x="64" y="138" width="992" height="42" rx="18" fill="#0f172a"/><rect x="64" y="164" width="992" height="16" fill="#0f172a"/>
    <circle cx="92" cy="160" r="7" fill="#fb7185"/><circle cx="116" cy="160" r="7" fill="#fbbf24"/><circle cx="140" cy="160" r="7" fill="#34d399"/><rect x="822" y="151" width="202" height="18" rx="9" fill="url(#bar)" opacity="0.85"/>
    <text x="84" y="220" class="mono prompt" font-size="18">$</text><text x="112" y="220" class="mono cmd" font-size="18">sudo systemctl stop ollama</text>
    <text x="84" y="258" class="mono muted" font-size="18"># Ollama is down. The app still talks to :11437.</text>
    <text x="84" y="302" class="mono prompt" font-size="18">$</text><text x="112" y="302" class="mono cmd" font-size="18">curl :11437/api/generate -d '{&quot;num_ctx&quot;:65536}'</text>
    <text x="84" y="346" class="mono warn" font-size="18">watchdog:</text><text x="198" y="346" class="mono cmd" font-size="18">ctx_guard qwen3:4b num_ctx 65536 → 4096</text>
    <text x="84" y="390" class="mono warn" font-size="18">watchdog:</text><text x="198" y="390" class="mono cmd" font-size="18">upstream refused → systemctl restart ollama</text>
    <text x="84" y="434" class="mono ok" font-size="18">ollama:</text><text x="170" y="434" class="mono cmd" font-size="18">runner started, KvSize:4096, GPU offload OK</text>
    <text x="84" y="486" class="mono ok" font-size="24" font-weight="800">HTTP 200</text><text x="206" y="486" class="mono accent" font-size="20">X-Ollama-Watchdog-Proxy: on-demand</text>
  </g>
  <g transform="translate(64 574)"><rect width="224" height="28" rx="14" fill="#064e3b"/><text x="16" y="20" class="sans" fill="#bbf7d0" font-size="14" font-weight="700">MIT · single-file Python</text><rect x="240" width="230" height="28" rx="14" fill="#1e3a8a"/><text x="256" y="20" class="sans" fill="#bfdbfe" font-size="14" font-weight="700">systemd-ready · no deps</text><rect x="486" width="286" height="28" rx="14" fill="#581c87"/><text x="502" y="20" class="sans" fill="#e9d5ff" font-size="14" font-weight="700">safe num_ctx guard for local LLMs</text></g>
</svg>
